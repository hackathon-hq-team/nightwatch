[project]
name = "nightwatch"
version = "0.1.0"
description = "AI on-call agent: reproduce, fix and verify production errors with NVIDIA Nemotron on Nebius Token Factory"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "openai>=1.40",
  "pydantic>=2.6",
  "python-dotenv>=1.0",
  "pytest>=8.0",
]

[project.optional-dependencies]
dev = ["ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
